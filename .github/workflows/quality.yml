# Publish passing tests/coverage first; then publish the slower mutation census if it finishes.
# The early publication retains the census's original commit/date and incomplete-scope warnings.
#
# The baseline rolls forward: each run compares against the metrics the previous run published, falling back
# to the committed baseline (quality/metrics.json) when there is none or its commit is not an ancestor. A
# 30-minute census budget keeps the run bounded; functions not reached keep their previous result, marked
# stale, and are re-measured on the next run. Unmeasured targets keep their identities; deadline interruptions
# never count as caught mutants. tests.yml separately supplies the suite status; this job supplies the
# QC Publication status. Compact badges link to the complete measurement and applicability record.
name: Quality

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mutation_budget_minutes:
        description: Mutation measurement budget (minutes; use 120 for a full refresh)
        type: number
        default: 30
        required: true

permissions:
  contents: read

concurrency:
  group: quality
  cancel-in-progress: true

env:
  PAGES_URL: https://rohanvinaik.github.io/TrialLedger

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.coverage-deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the commit diff against the baseline needs history
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install the locked environment
        run: uv sync --locked
      - name: Choose the baseline
        run: |
          if curl -fsSL "$PAGES_URL/metrics.json" -o "$RUNNER_TEMP/published.json" \
            && git merge-base --is-ancestor "$(jq -r .commit "$RUNNER_TEMP/published.json")" HEAD; then
            echo "BASELINE=$RUNNER_TEMP/published.json" >> "$GITHUB_ENV"
            echo "baseline: last published measurement"
          else
            echo "BASELINE=quality/metrics.json" >> "$GITHUB_ENV"
            echo "baseline: committed quality/metrics.json"
          fi
      - name: Measure tests and coverage without waiting for mutation work
        run: >-
          uv run --no-sync --with coverage --with pytest-cov
          python scripts/quality_metrics.py --coverage-only --incremental "$BASELINE" --out _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: github-pages-coverage
          path: _site
      - id: coverage-deployment
        name: Publish tests and coverage with the historical census clearly labelled
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-coverage
      - name: Measure the changed-function mutation census
        env:
          MUTATION_BUDGET_MINUTES: ${{ inputs.mutation_budget_minutes || 30 }}
        run: >-
          uv run --no-sync --with coverage --with pytest-cov
          python scripts/quality_metrics.py --incremental _site/metrics.json --out _site
          --workers 4 --budget-minutes "$MUTATION_BUDGET_MINUTES"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  publish:
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
