# Lint and the whole test suite on every push and pull request. This workflow's status is the README's
# "tests" badge, kept separate from the slower quality measurement so it reflects only lint and tests.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install the locked environment
        run: uv sync --locked
      - name: Lint and format
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Tests
        run: .venv/bin/pytest
