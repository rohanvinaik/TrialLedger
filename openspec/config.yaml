schema: spec-driven
context: |
  Follow docs/THEORY_OF_THE_CASE.md and the founder's instructions; do not revise theory to justify code.
  Layer one is source evidence -> clinical JSON/workbook -> chatbot answers from that record.
  Layer two is the separate symbolic automated trial writer, fully designed and partly implemented.
  Preserve correct partial logic; incomplete integration is not a reason to discard a useful component.
  Word recognition never establishes clinical meaning by itself. Preserve scope and alternatives; abstain on unresolved binding.
  Known requires a direct warrant or strict derivation; defaults, proposals and user choices remain distinct.
  Clinical compilers, vocabulary campaigns and governance frameworks are not layer-one completion gates.
rules:
  proposal:
    - Name the layer and concrete useful behavior. Do not expand scope to explain implementation difficulty.
  design:
    - State input/output contracts, consumers, independent evidence and unresolved bindings.
    - Distinguish a designed capability, a working component and an integrated workflow.
  tasks:
    - Mark completion only from current entry-point evidence, including positive and negative intent cases.
