[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TrialLedger"
dynamic = ["version"]
description = "ClinicalTrials.gov reference spreadsheets and matching JSON. A separate, fully designed automated trial writer has working symbolic reasoning components; its complete pipeline is partly built."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohan Vinaik" }]
dependencies = [
    "httpx>=0.28",
    "openpyxl>=3.1",
]

[project.scripts]
trialledger = "TrialLedger.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16",
    "pyyaml>=6.0",
    "detective-spec>=1.2.2",
    "vulture>=2.14",
]

[tool.uv]
python-preference = "only-managed"

[tool.hatch.version]
path = "TrialLedger/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["TrialLedger"]

# The build stamp (hatch_build.py): an installed copy records the commit it was built from in
# TrialLedger/build_commit.txt, which record.code_commit reads when it is not a git checkout.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Detective's generated suites: written and ruff-formatted by Detective; their docstrings run long.
"tests/detective/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = [
    "detective: test generated by Detective",
    "live: calls the real ClinicalTrials.gov API (opt-in: uv run pytest -m live)",
]
xfail_strict = true
