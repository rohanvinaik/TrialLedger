[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TrialLedger"
dynamic = ["version"]
description = "A tool AI assistants use for clinical trials: every relevant ClinicalTrials.gov study gathered into a verified record and spreadsheet, and a trial designed from that evidence. No language model abstracts a trial or supplies a fact."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Rohan Vinaik" }]
dependencies = [
    "httpx>=0.28",
    "openpyxl>=3.1",
]

[project.scripts]
trialledger = "TrialLedger.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16",
    "pyyaml>=6.0",
    "detective-spec>=1.2.2",
    "vulture>=2.14",
]

[tool.uv]
python-preference = "only-managed"

[tool.hatch.version]
path = "TrialLedger/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["TrialLedger"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Detective's generated suites: written and ruff-formatted by Detective; their docstrings run long.
"tests/detective/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = [
    "detective: test generated by Detective",
    "live: calls the real ClinicalTrials.gov API (opt-in: uv run pytest -m live)",
]
xfail_strict = true
